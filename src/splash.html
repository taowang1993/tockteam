<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TockTeam Desktop</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f5; color: #18181a; }
      main { width: min(520px, calc(100vw - 48px)); text-align: center; }
      .mark { width: 68px; height: 68px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 20px; color: white; background: linear-gradient(145deg, #4d8dff, #2557d6); box-shadow: 0 16px 38px rgb(38 89 214 / 28%); }
      .mark svg { width: 44px; height: 44px; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
      p { margin: 10px auto 0; max-width: 440px; color: #6f7075; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
      .spinner { width: 22px; height: 22px; margin: 26px auto 0; border: 2px solid rgb(90 91 96 / 20%); border-top-color: #3778ed; border-radius: 50%; animation: spin .8s linear infinite; }
      .error .spinner { display: none; }
      .error .mark { background: linear-gradient(145deg, #ef6a62, #c93535); }
      .detail { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: rgb(127 127 127 / 10%); color: #77787d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; text-align: left; overflow-wrap: anywhere; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { background: #202020; color: #f5f5f3; }
        p { color: #a6a6aa; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg aria-label="TockTeam Clock" data-tockteam-product-mark="true" fill="none" role="img" viewBox="0 0 20 20">
          <path d="M10 5.5C6.96243 5.5 4.5 7.96243 4.5 11C4.5 14.0376 6.96243 16.5 10 16.5C13.0376 16.5 15.5 14.0376 15.5 11C15.5 7.96243 13.0376 5.5 10 5.5ZM2.5 11C2.5 6.85786 5.85786 3.5 10 3.5C14.1421 3.5 17.5 6.85786 17.5 11C17.5 15.1421 14.1421 18.5 10 18.5C5.85786 18.5 2.5 15.1421 2.5 11Z" fill="currentColor" />
          <path d="M2.79289 18.2071C3.18342 18.5976 3.81658 18.5976 4.20711 18.2071L5.70711 16.7071C6.09763 16.3166 6.09763 15.6834 5.70711 15.2929C5.31658 14.9023 4.68342 14.9023 4.29289 15.2929L2.79289 16.7929C2.40237 17.1834 2.40237 17.8166 2.79289 18.2071Z" fill="currentColor" />
          <path d="M14.2929 15.2929C14.6834 14.9024 15.3166 14.9024 15.7071 15.2929L17.2071 16.7929C17.5976 17.1834 17.5976 17.8166 17.2071 18.2071C16.8166 18.5977 16.1834 18.5977 15.7929 18.2071L14.2929 16.7071C13.9024 16.3166 13.9024 15.6834 14.2929 15.2929Z" fill="currentColor" />
          <path d="M7.5 10.5 L9.5 13 L13 8.6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
          <path d="M6.33196 3.17163L2.57422 6.76042C2.57422 6.76042 2.49689 6.6895 2.38431 6.56157C2.12745 6.26968 1.68708 5.68098 1.56299 4.9606C1.45034 4.30659 1.59837 3.54403 2.3811 2.79649C3.16383 2.04896 3.93239 1.93613 4.58053 2.07874C5.29445 2.23581 5.86228 2.70277 6.14205 2.97278C6.26467 3.09112 6.33196 3.17163 6.33196 3.17163Z" fill="currentColor" />
          <path d="M13.668 3.17163L17.4258 6.76042C17.4258 6.76042 17.5031 6.6895 17.6157 6.56157C17.8726 6.26968 18.3129 5.68098 18.437 4.9606C18.5497 4.30659 18.4016 3.54403 17.6189 2.79649C16.8362 2.04896 16.0676 1.93613 15.4195 2.07874C14.7055 2.23581 14.1377 2.70277 13.8579 2.97278C13.7353 3.09112 13.668 3.17163 13.668 3.17163Z" fill="currentColor" />
        </svg>
      </div>
      <h1>TockTeam Desktop</h1>
      <p id="message">正在启动 TockTeam…</p>
      <div class="spinner" aria-label="正在启动"></div>
      <div class="detail" id="detail" hidden></div>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const state = params.get('state')
      const message = params.get('message')
      const detail = params.get('detail')
      if (state === 'error') document.body.classList.add('error')
      if (message) document.querySelector('#message').textContent = message
      if (detail) {
        const node = document.querySelector('#detail')
        node.textContent = detail
        node.hidden = false
      }
    </script>
  </body>
</html>
