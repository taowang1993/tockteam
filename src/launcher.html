<!doctype html>
<html lang="en-US" class="h-full bg-transparent text-[var(--dsw-alias-label-primary,CanvasText)] [color-scheme:light_dark]" data-launcher-ready="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; object-src 'none'" />
    <link rel="stylesheet" href="./launcher.css" />
    <script type="module" src="./launcher.js"></script>
    <title>TockLauncher</title>
  </head>
  <body class="m-0 h-full min-h-0 overflow-hidden bg-transparent font-sans text-[var(--dsw-alias-label-primary,CanvasText)] motion-reduce:transition-none motion-reduce:animate-none">
    <main id="launcher-root" class="launcher-command-surface motion-reduce:transition-none" data-launcher-ready="false">
      <h1 class="sr-only">TockLauncher</h1>
      <div id="launcher-search-form" class="launcher-command-header group [-webkit-app-region:drag]" role="search">
        <label for="launcher-search" class="relative min-w-0 flex-1 [-webkit-app-region:no-drag]">
          <span id="launcher-search-label" class="sr-only">Search TockLauncher</span>
          <span id="launcher-search-icon" class="pointer-events-none absolute left-0 top-1/2 hidden -translate-y-1/2 text-[var(--dsw-alias-label-secondary,CanvasText)]" aria-hidden="true" hidden></span>
          <input id="launcher-search" class="launcher-command-search pr-10 [-webkit-app-region:no-drag]" type="search" role="combobox" aria-autocomplete="list" aria-controls="launcher-results" aria-expanded="false" autocomplete="off" placeholder="Type here..." />
        </label>
        <button id="launcher-history-toggle" class="absolute right-4 grid size-8 shrink-0 place-items-center rounded-md border border-transparent p-1 text-[0px] text-[var(--dsw-alias-label-secondary,CanvasText)] opacity-0 transition-[opacity,background-color] duration-150 hover:bg-[var(--dsw-alias-interactive-bg-hover,rgb(0_0_0_/_6%))] focus-visible:opacity-100 focus-visible:outline-2 focus-visible:outline-[var(--dsw-alias-brand-primary,CanvasText)] group-hover:opacity-100 aria-expanded:opacity-100 [-webkit-app-region:no-drag]" type="button" aria-label="Search History" aria-controls="launcher-history" aria-expanded="false" aria-haspopup="menu">History</button>
      </div>
      <div id="launcher-history" class="launcher-command-menu inset-x-2.5 top-[52px] z-20 w-auto max-h-40" role="menu" aria-label="Search History" hidden></div>
      <div id="launcher-provider-statuses" class="min-w-0 border-b border-[var(--dsw-alias-border-l1,var(--dsw-alias-border-l2,CanvasText))] px-3 py-1 text-xs text-[var(--dsw-alias-label-secondary,CanvasText)]" role="status" aria-live="polite" hidden></div>
      <ul id="launcher-results" class="launcher-command-list" role="listbox" aria-label="TockLauncher destinations"></ul>
      <footer id="launcher-footer" class="launcher-command-footer [-webkit-app-region:drag]">
        <div id="launcher-footer-selection" class="launcher-command-footer-identity [-webkit-app-region:no-drag]"></div>
        <p id="launcher-status" class="m-0 max-w-56 truncate text-xs text-[var(--dsw-alias-label-secondary,CanvasText)] data-[tone=error]:text-[var(--dsw-alias-state-error-primary,CanvasText)] data-[tone=ready]:sr-only" role="status" aria-live="polite" aria-atomic="true">Destinations will appear here.</p>
        <div id="launcher-details" class="relative ml-auto flex min-w-0 shrink-0 items-center justify-end [-webkit-app-region:no-drag]"></div>
      </footer>
    </main>
  </body>
</html>
