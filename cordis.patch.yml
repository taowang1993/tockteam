# TockTeam-Desktop is a bundle layer over dsh-base + dsh-web-app. The Electron
# distribution keeps DSH's browser UI and mounts each desktop behavior as an
# independently registered Host/Client plugin.

- id: webserver
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  config:
    printUrl: true
    surfaceContext: false
    trustedHosts: []

- insert:
    - id: oh-desktop
      name: '@tockteam/desktop'

    - id: oh-better-sidebar-runtime
      name: '@tockteam/better-sidebar-runtime'

    - id: oh-skins
      name: '@tockteam/skins'

    - id: oh-sidebar
      name: '@tockteam/sidebar'

    - id: oh-panel-controls
      name: '@tockteam/panel-controls'

    - id: oh-pinned-summary
      name: '@tockteam/pinned-summary'

    - id: oh-plugin-marketplace
      name: '@tockteam/plugin-marketplace'
