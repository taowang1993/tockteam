# TockTeam-Desktop is a bundle layer over dsh-base + dsh-web-app. The Electron
# distribution keeps DSH's browser UI and mounts each desktop behavior as an
# independently registered Host/Client plugin.

- id: webserver
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  config:
    printUrl: true
    surfaceContext: false
    trustedHosts: []

- insert:
    - id: tockteam-desktop
      name: '@tockteam/desktop'

    - id: tockteam-better-sidebar-runtime
      name: '@tockteam/better-sidebar-runtime'

    - id: tockteam-skins
      name: '@tockteam/skins'

    - id: tockteam-sidebar
      name: '@tockteam/sidebar'

    - id: tockteam-panel-controls
      name: '@tockteam/panel-controls'

    - id: tockteam-pinned-summary
      name: '@tockteam/pinned-summary'

    - id: tockteam-plugin-marketplace
      name: '@tockteam/plugin-marketplace'

# The Runtime bundle owns this entry. Desktop supplies both empty roots because
# the loader replaces the package patch config as one object.
- id: note-vault-runtime
  name: tockbot-note-runtime
  config:
    stateRoot: null
    vaultRoot: null
