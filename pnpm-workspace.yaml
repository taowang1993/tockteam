packages:
  - .
  - plugins/*
  - '!plugins/tocktutor'
  - upstream/dsh-TUI
  - upstream/dsh-TUI/vendor/dsh-std/packages/command
  - upstream/dsh-TUI/vendor/dsh-std/packages/connection
  - upstream/dsh-TUI/vendor/dsh-std/packages/core
  - upstream/dsh-TUI/vendor/dsh-std/packages/manifest
  - upstream/dsh-TUI/vendor/dsh-std/packages/messages
  - upstream/dsh-TUI/vendor/dsh-std/packages/presentation
  - upstream/dsh-TUI/vendor/dsh-std/packages/storage
  - web

minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  - dsh-working-activity@0.2.2

# The pinned TUI uses React 19. Its renderer dependencies and the DSH 0.1.1
# client packages are exercised together by the TUI adapter and surface smoke,
# but their published React peer ranges have not caught up yet.
peerDependencyRules:
  allowedVersions:
    react: ^19.0.0

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: false
  node-pty: true
  sqlite3: true

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - node-pty
  - sqlite3

overrides:
  # Keep bundled TockTutor clients on the root Desktop and UI singletons.
  '@tockteam/desktop': link:.
  '@tockteam/ui': link:plugins/ui
  # Preserve the reviewed Tockbot lock closure for the exact local XML runtime.
  '@nodable/entities': 2.1.1
  fast-xml-builder: 1.2.0
  path-expression-matcher: 1.5.0
  strnum: 2.2.3
  xml-naming: 0.1.0
  # Keep the TUI's optional and exact development peers on the pinned DSH line.
  dsh-working-activity>@deepseek-ai/dsh-client-ui-slots: 0.1.1-rc.2
  '@deepseek-harness-tui/dsh-tui>@deepseek-ai/dsh-agent': 0.1.1-rc.2
  '@deepseek-harness-tui/dsh-tui>@deepseek-ai/dsh-agent-instructions': 0.1.1-rc.2
  '@deepseek-harness-tui/dsh-tui>@deepseek-ai/dsh-typert-protocol': 0.1.1-rc.2
