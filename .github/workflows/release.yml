name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            id: macos-arm64
            os: macos-15
            dist_script: dist:mac
            node_platform: darwin
            node_arch: arm64
          - name: macOS x64
            id: macos-x64
            os: macos-15-intel
            dist_script: dist:mac:x64
            node_platform: darwin
            node_arch: x64
          - name: Linux x64
            id: linux-x64
            os: ubuntu-24.04
            dist_script: dist:linux
            node_platform: linux
            node_arch: x64
          # Windows is build-verified in the CI matrix, but the pinned DSH
          # runtime is not portable on Windows yet: pnpm's junction-based
          # workspace layout contains cycles that packaging tools follow
          # until Windows path limits fail. Re-add this job once staging
          # produces a junction-free runtime on Windows.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_DESKTOP_NODE_ARCH: ${{ matrix.node_arch }}
      DSH_DESKTOP_NODE_PLATFORM: ${{ matrix.node_platform }}
      npm_config_pm_on_fail: 'ignore'

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop distribution
        run: pnpm run ${{ matrix.dist_script }}

      - name: Package TockTeam-Web distribution
        run: node scripts/build-web.mjs

      - name: Package TockTeam TUI distribution
        run: node scripts/build-tui.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.id }}
          compression-level: 0
          path: |
            release/TockTeam-Desktop-*
            release/tockteam-web-*.tar.gz
            release/tockteam-web-*.zip
            release/tockteam-tui-*.tar.gz
            release/tockteam-tui-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
