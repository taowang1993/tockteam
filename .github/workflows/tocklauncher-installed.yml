name: TockLauncher Installed Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 installed portable archive (tar.gz) TockLauncher evidence
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          architecture: x64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ueli parity and package gates
        id: ueli-gates
        shell: bash
        run: |
          pnpm test:ueli-baseline
          pnpm audit:ueli-baseline
          pnpm test:ueli-launcher-parity
          pnpm audit:ueli-launcher-parity
          pnpm test:ueli-package-feasibility
          pnpm audit:ueli-package-feasibility

      - name: Build and install the disposable portable archive (tar.gz; restore runtime links)
        id: installed-smoke
        shell: bash
        env:
          TOCKTEAM_KEEP_INSTALLED_SMOKE: "1"
          TOCKTEAM_INSTALLED_SMOKE_TEMP_ROOT: ${{ runner.temp }}
          TOCKTEAM_INSTALLED_SMOKE_REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
          TOCKTEAM_INSTALLED_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
        run: pnpm test:launcher:installed

      - name: Verify the installed report identity and version
        id: report-check
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
        run: node scripts/check-installed-report.mjs "$REPORT"

      - name: Record installed gate outcomes
        if: always()
        shell: bash
        env:
          GATE_LOG: ${{ runner.temp }}/tockteam-installed-launcher-gate-${{ github.run_id }}.json
          UELI_OUTCOME: ${{ steps.ueli-gates.outcome }}
          SMOKE_OUTCOME: ${{ steps.installed-smoke.outcome }}
          REPORT_OUTCOME: ${{ steps.report-check.outcome }}
        run: |
          printf '{\n  "ueliGates": "%s",\n  "installedSmoke": "%s",\n  "reportCheck": "%s"\n}\n' "$UELI_OUTCOME" "$SMOKE_OUTCOME" "$REPORT_OUTCOME" > "$GATE_LOG"

      - name: Upload Windows installed smoke diagnostics
        if: always() && steps.installed-smoke.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-windows-x64-diagnostics-${{ github.run_id }}
          compression-level: 0
          path: ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
          if-no-files-found: error

      - name: Upload Windows installed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-windows-x64-${{ github.run_id }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-*/installer/*.tar.gz
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
            ${{ runner.temp }}/tockteam-installed-launcher-gate-${{ github.run_id }}.json
          if-no-files-found: error

  linux-x64:
    name: Linux x64 installed deb and AppImage TockLauncher evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          architecture: x64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Electron display dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libasound2t64 libgtk-3-0 libgbm1 libxss1 libatk-bridge2.0-0 libatspi2.0-0 libnotify4 libsecret-1-0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ueli parity and package gates
        id: ueli-gates
        shell: bash
        run: |
          pnpm test:ueli-baseline
          pnpm audit:ueli-baseline
          pnpm test:ueli-launcher-parity
          pnpm audit:ueli-launcher-parity
          pnpm test:ueli-package-feasibility
          pnpm audit:ueli-package-feasibility

      - name: Build and install disposable deb/AppImage artifacts
        id: installed-smoke
        shell: bash
        env:
          TOCKTEAM_KEEP_INSTALLED_SMOKE: "1"
          TOCKTEAM_INSTALLED_SMOKE_TEMP_ROOT: ${{ runner.temp }}
          TOCKTEAM_INSTALLED_SMOKE_REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
          TOCKTEAM_INSTALLED_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
        run: xvfb-run -a pnpm test:launcher:installed

      - name: Verify the installed report identity and version
        id: report-check
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
        run: node scripts/check-installed-report.mjs "$REPORT"

      - name: Record installed gate outcomes
        if: always()
        shell: bash
        env:
          GATE_LOG: ${{ runner.temp }}/tockteam-installed-launcher-gate-${{ github.run_id }}.json
          UELI_OUTCOME: ${{ steps.ueli-gates.outcome }}
          SMOKE_OUTCOME: ${{ steps.installed-smoke.outcome }}
          REPORT_OUTCOME: ${{ steps.report-check.outcome }}
        run: |
          printf '{\n  "ueliGates": "%s",\n  "installedSmoke": "%s",\n  "reportCheck": "%s"\n}\n' "$UELI_OUTCOME" "$SMOKE_OUTCOME" "$REPORT_OUTCOME" > "$GATE_LOG"

      - name: Upload Linux installed smoke diagnostics
        if: always() && steps.installed-smoke.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-linux-x64-diagnostics-${{ github.run_id }}
          compression-level: 0
          path: ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
          if-no-files-found: error

      - name: Upload Linux installed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-linux-x64-${{ github.run_id }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-*/installer/*.deb
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-*/installer/*.AppImage
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
            ${{ runner.temp }}/tockteam-installed-launcher-gate-${{ github.run_id }}.json
          if-no-files-found: error
