name: TockLauncher Installed Evidence

on:
  workflow_dispatch:
    inputs:
      linux_prior_run_id:
        description: Successful prior installed-evidence run containing the preserved compatible deb (required except when bootstrapping)
        required: false
        type: string
      bootstrap_linux_prior:
        description: Build a replacement Linux baseline only; does not prove rollback or complete release verification
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  macos-arm64:
    name: macOS arm64 installed TockLauncher evidence
    if: ${{ !inputs.bootstrap_linux_prior }}
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          architecture: arm64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Package Gates and Installed Smoke
        env:
          TOCKTEAM_INSTALLED_SMOKE_TEMP_ROOT: ${{ runner.temp }}/tockteam.noindex
          TOCKTEAM_INSTALLED_SMOKE_REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
          TOCKTEAM_INSTALLED_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
        run: |
          pnpm test:ueli-package-feasibility
          pnpm audit:ueli-package-feasibility
          pnpm test:launcher:installed
          node scripts/check-installed-report.mjs "$TOCKTEAM_INSTALLED_SMOKE_REPORT"

      - name: Upload macOS Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-macos-arm64-${{ github.run_id }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
            ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
          if-no-files-found: error

  windows-x64:
    name: Windows x64 installed portable archive (tar.gz) TockLauncher evidence
    if: ${{ !inputs.bootstrap_linux_prior }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          architecture: x64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ueli-Derived Launcher Package Gate
        id: ueli-gates
        shell: bash
        run: |
          pnpm test:ueli-package-feasibility
          pnpm audit:ueli-package-feasibility

      - name: Build and install the disposable portable archive (tar.gz; restore runtime links)
        id: installed-smoke
        shell: bash
        env:
          TOCKTEAM_KEEP_INSTALLED_SMOKE: "1"
          TOCKTEAM_INSTALLED_SMOKE_TEMP_ROOT: ${{ runner.temp }}
          TOCKTEAM_INSTALLED_SMOKE_REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
          TOCKTEAM_INSTALLED_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
        run: pnpm test:launcher:installed

      - name: Verify the installed report identity and version
        id: report-check
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
        run: node scripts/check-installed-report.mjs "$REPORT"

      - name: Record installed gate outcomes
        if: always()
        shell: bash
        env:
          GATE_LOG: ${{ runner.temp }}/tockteam-installed-launcher-gate-${{ github.run_id }}.json
          UELI_OUTCOME: ${{ steps.ueli-gates.outcome }}
          SMOKE_OUTCOME: ${{ steps.installed-smoke.outcome }}
          REPORT_OUTCOME: ${{ steps.report-check.outcome }}
        run: |
          printf '{\n  "ueliGates": "%s",\n  "installedSmoke": "%s",\n  "reportCheck": "%s"\n}\n' "$UELI_OUTCOME" "$SMOKE_OUTCOME" "$REPORT_OUTCOME" > "$GATE_LOG"

      - name: Upload Windows installed smoke diagnostics
        if: always() && steps.installed-smoke.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-windows-x64-diagnostics-${{ github.run_id }}
          compression-level: 0
          path: ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
          if-no-files-found: error

      - name: Upload Windows installed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-windows-x64-${{ github.run_id }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-*/installer/*.tar.gz
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
            ${{ runner.temp }}/tockteam-installed-launcher-gate-${{ github.run_id }}.json
          if-no-files-found: error

  linux-x64:
    name: Linux x64 installed deb and AppImage TockLauncher evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Validate Baseline Selection
        shell: bash
        env:
          BOOTSTRAP_PRIOR: ${{ inputs.bootstrap_linux_prior }}
          PRIOR_RUN_ID: ${{ inputs.linux_prior_run_id }}
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP_PRIOR" = true ]; then
            test -z "$PRIOR_RUN_ID"
          else
            [[ "$PRIOR_RUN_ID" =~ ^[0-9]+$ ]]
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          architecture: x64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Electron display dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libasound2t64 libgtk-3-0 libgbm1 libxss1 libatk-bridge2.0-0 libatspi2.0-0 libnotify4 libsecret-1-0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ueli-Derived Launcher Package Gate
        id: ueli-gates
        shell: bash
        run: |
          pnpm test:ueli-package-feasibility
          pnpm audit:ueli-package-feasibility

      - name: Download the preserved prior Linux package
        id: prior-deb
        if: ${{ !inputs.bootstrap_linux_prior }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN_ID: ${{ inputs.linux_prior_run_id }}
          PRIOR_DIR: ${{ runner.temp }}/tockteam-linux-prior-${{ inputs.linux_prior_run_id }}
        run: |
          set -euo pipefail
          test "$(gh run view "$PRIOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          gh run download "$PRIOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "tocklauncher-installed-linux-x64-$PRIOR_RUN_ID" --dir "$PRIOR_DIR"
          mapfile -d '' prior_debs < <(find "$PRIOR_DIR" -type f -name '*.deb' -print0)
          test "${#prior_debs[@]}" -eq 1
          printf 'path=%s\n' "${prior_debs[0]}" >> "$GITHUB_OUTPUT"

      - name: Build and install disposable deb/AppImage artifacts
        id: installed-smoke
        shell: bash
        env:
          TOCKTEAM_KEEP_INSTALLED_SMOKE: "1"
          TOCKTEAM_INSTALLED_SMOKE_TEMP_ROOT: ${{ runner.temp }}
          TOCKTEAM_INSTALLED_SMOKE_REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
          TOCKTEAM_INSTALLED_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
          TOCKTEAM_LINUX_ROLLBACK_DEB: ${{ steps.prior-deb.outputs.path }}
          TOCKTEAM_LINUX_ROLLBACK_SOURCE_RUN: ${{ inputs.linux_prior_run_id }}
        run: |
          set -euo pipefail
          original_core_pattern="$(/usr/sbin/sysctl -n kernel.core_pattern)"
          restore_core_pattern() {
            /usr/bin/sudo -n /usr/sbin/sysctl -q -w "kernel.core_pattern=$original_core_pattern"
          }
          trap restore_core_pattern EXIT
          /usr/bin/sudo -n /usr/sbin/sysctl -q -w kernel.core_pattern=/tmp/tockteam-core
          ulimit -c 0
          /usr/bin/xvfb-run -a pnpm test:launcher:installed

      - name: Verify the installed report identity and version
        id: report-check
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
        run: node scripts/check-installed-report.mjs "$REPORT"

      - name: Record installed gate outcomes
        if: always()
        shell: bash
        env:
          GATE_LOG: ${{ runner.temp }}/tockteam-installed-launcher-gate-${{ github.run_id }}.json
          UELI_OUTCOME: ${{ steps.ueli-gates.outcome }}
          SMOKE_OUTCOME: ${{ steps.installed-smoke.outcome }}
          REPORT_OUTCOME: ${{ steps.report-check.outcome }}
        run: |
          printf '{\n  "ueliGates": "%s",\n  "installedSmoke": "%s",\n  "reportCheck": "%s"\n}\n' "$UELI_OUTCOME" "$SMOKE_OUTCOME" "$REPORT_OUTCOME" > "$GATE_LOG"

      - name: Verify Rollback Proof or Explicit Baseline-Only Result
        shell: bash
        env:
          BOOTSTRAP_PRIOR: ${{ inputs.bootstrap_linux_prior }}
          REPORT: ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const rollback = JSON.parse(readFileSync(process.env.REPORT, 'utf8')).installed.deb.rollback;
          if (process.env.BOOTSTRAP_PRIOR === 'true') {
            assert.equal(rollback.state, 'workflow-required');
            console.log('Baseline only: rollback remains unverified until a full run uses this package.');
          } else {
            assert.equal(rollback.validationFailureRecovered, true);
            assert.equal(rollback.mechanism, 'reinstall-preserved-prior-deb');
          }
          JS

      - name: Capture Linux kernel crash diagnostics
        if: always() && steps.installed-smoke.outcome == 'failure'
        shell: bash
        env:
          KERNEL_DIAGNOSTICS: ${{ runner.temp }}/tockteam-installed-kernel-diagnostics-${{ github.run_id }}.txt
        run: |
          set +e
          {
            printf '%s\n' 'TockTeam Linux installed smoke kernel diagnostics'
            printf '%s\n' '[dmesg tail]'
            /usr/bin/timeout 10s /usr/bin/sudo -n /usr/bin/dmesg 2>&1 | /usr/bin/tail -n 200
            dmesg_status=${PIPESTATUS[0]}
            if [ "$dmesg_status" -ne 0 ]; then
              printf '[dmesg unavailable; exit=%s]\n' "$dmesg_status"
              printf '%s\n' '[journalctl -k tail]'
              /usr/bin/timeout 10s /usr/bin/sudo -n /usr/bin/journalctl -k --no-pager --lines=200 2>&1 | /usr/bin/tail -n 200
              journalctl_status=${PIPESTATUS[0]}
              if [ "$journalctl_status" -ne 0 ]; then
                printf '[journalctl unavailable; exit=%s]\n' "$journalctl_status"
              fi
            fi
          } > "$KERNEL_DIAGNOSTICS" 2>&1
          test -f "$KERNEL_DIAGNOSTICS"

      - name: Upload Linux installed smoke diagnostics
        if: always() && steps.installed-smoke.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-linux-x64-diagnostics-${{ github.run_id }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/tockteam-installed-launcher-diagnostics-${{ github.run_id }}.json
            ${{ runner.temp }}/tockteam-installed-kernel-diagnostics-${{ github.run_id }}.txt
          if-no-files-found: error

      - name: Upload Linux installed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tocklauncher-installed-linux-x64-${{ github.run_id }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-*/installer/*.deb
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-*/installer/*.AppImage
            ${{ runner.temp }}/tockteam-installed-launcher-smoke-${{ github.run_id }}.json
            ${{ runner.temp }}/tockteam-installed-launcher-gate-${{ github.run_id }}.json
          if-no-files-found: error
