name: Search Recovery Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C plugins/tocktutor install --frozen-lockfile
      - name: Locate the Recovery Timeout
        env:
          TOCKTEAM_SEARCH_QUERY_LOAD: '1'
        shell: pwsh
        working-directory: plugins/tocktutor/packages/tockbot-note-runtime
        run: |
          for ($i = 1; $i -le 30; $i++) {
            Write-Output "Recovery iteration $i"
            node scripts/test-search-index.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
