name: Search Recovery Diagnostic

on:
  workflow_dispatch:
    inputs:
      runner_temp:
        description: Use the runner-owned temporary folder instead of the operating-system default.
        type: boolean
        default: false
      iterations:
        description: Number of bounded native-gate runs.
        type: choice
        default: '30'
        options: ['1', '30']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C plugins/tocktutor install --frozen-lockfile
      - name: Use the Runner-Owned Test Folder
        if: inputs.runner_temp
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Verify Native Stack Capture
        shell: pwsh
        run: |
          $debugger = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $debugger
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') {
            throw 'Expected a valid Microsoft-signed debugger; no installation or fallback permitted.'
          }
          $env:TOCKTEAM_NATIVE_DEBUGGER = $debugger
          node scripts/probe-search-native-debugger.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TOCKTEAM_NATIVE_DEBUGGER=$debugger" >> $env:GITHUB_ENV
      - name: Locate the Recovery Timeout
        env:
          TOCKTEAM_SEARCH_QUERY_LOAD: '0'
          RECOVERY_ITERATIONS: ${{ inputs.iterations }}
          USE_RUNNER_TEMP: ${{ inputs.runner_temp }}
        shell: pwsh
        working-directory: plugins/tocktutor/packages/tockbot-note-runtime
        run: |
          node -e "const folder = require('node:os').tmpdir(); console.log('Native test temporary folder:', folder); if (process.env.USE_RUNNER_TEMP === 'true') require('node:assert/strict').equal(folder, process.env.RUNNER_TEMP)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iterations = [int]$env:RECOVERY_ITERATIONS
          if ($iterations -notin 1, 30) { throw 'Expected 1 or 30 iterations.' }
          for ($i = 1; $i -le $iterations; $i++) {
            Write-Output "Recovery iteration $i"
            node scripts/test-search-index.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
